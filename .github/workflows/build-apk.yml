name: Build Android APK

on:
  push:
    branches:
      - flutter-apk
      - main
  pull_request:
    branches:
      - flutter-apk
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: '.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: AI-PPT-Flutter
        run: flutter pub get

      - name: Generate code
        working-directory: AI-PPT-Flutter
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        working-directory: AI-PPT-Flutter
        continue-on-error: true
        run: flutter analyze

      - name: Build APK (Release)
        working-directory: AI-PPT-Flutter
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: AI-PPT-Flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Get APK info
        working-directory: AI-PPT-Flutter
        if: success()
        run: |
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK Size: $APK_SIZE"
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: AI-PPT-Flutter/build/
          retention-days: 7
